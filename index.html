<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jovano — Join our global remote team</title>
    <meta name="description" content="Remote careers for capable people everywhere. Six fully remote roles — virtual assistant, support, engineering, QA, operations and business development. Free to apply, reviewed by a real person, paid twice a month." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Baloo+2:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <meta property="og:title" content="Jovano — Join our global remote team" />
    <meta property="og:site_name" content="Jovano" />
    <meta property="og:description" content="Six fully remote career paths, one global team. Free to apply, reviewed by a real person, paid on time." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary" />

    <script>
      // Colour theme: the visitor's saved choice (see src/hooks/use-site-theme.ts), else light.
      // Applied before first paint so the page never flashes the other theme.
      (function (d) {
        var t = null;
        try {
          t = localStorage.getItem("jovano-theme");
        } catch (e) {}
        d.dataset.theme = t === "dark" ? "dark" : "light";
      })(document.documentElement);
    </script>
    <style>
      html { background: #ffffff; }
      html[data-theme="dark"] { background: #080e1e; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
